  <header>
    <img src="assets/img/logo.webp" id="logo">
    <nav id="main-nav" class="nav">
      <a href="login.html" id="nav-login" class="nav__point nav__page-link nav__page-link--current">Войти</a>

  <main>
    <form class="form login-form" action="profile.html" method="post">

        E-mail
        <input class="input form__input" type="email" required>
        <div class="form__input-error-message">Введите корректный E-mail</div>

      <label class="form__input-label">
        Пароль
        <input class="input form__input" type="password"required>
        <div class="form__input-error-message">Введите корректный пароль (длина не менее 8 символов)</div>
      </label>
      <button class="button login-form__button">Войти</button>
      <a href="login.html">
        <span>Забыли пароль?</span>
      </a>
    </form>
