<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/styles/reset.css">
  <link rel="stylesheet" href="assets/styles/global.css">
  <link rel="stylesheet" href="assets/styles/index.css">
  <title>BESTGAMES</title>
</head>
<body>
  <header>
    <img src="assets/images/logo.png" class="main-logo">
    <nav class="main-nav">
      <div class="main-nav__pages">
        <a href="index.html" class="main-nav__page-link main-nav__page-link--current">Главная</a>
        <a href="catalog.html" class="main-nav__page-link">Каталог</a>
        <a href="index.html" class="main-nav__search-link"><input class="main-nav__search" placeholder="Поиск"></a>
      </div>
      <div class="main-nav__auth">
        <a href="login.html" class="main-nav__page-link">Вход</a>
        <span>|</span>
        <a href="register.html" class="main-nav__page-link">Регистрация</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="slider">
      <input type="radio" name="slider" class="slider__radio" id="slide1" checked>
      <input type="radio" name="slider" class="slider__radio" id="slide2">
      <input type="radio" name="slider" class="slider__radio" id="slide3">
      <div class="slider__slides-wrapper">
        <div class="slider__slides">
          <div class="slider__slide">
            <img src="assets/images/logo.png">
            <div class="slider__slide-info">
              <span class="slider__game-title">PARASHA</span>
              <span class="slider__game-price">$0.50</span>
              <a href="index.html" class="slider__more-btn">ПОДРОБНЕЕ</a>
            </div>
          </div>
          <div class="slider__slide">
            <img src="assets/images/ziploc_tree.png">
            <div class="slider__slide-info">
              <span class="slider__game-title">KAKAIN</span>
              <span class="slider__game-price">$299.00</span>
              <a href="index.html" class="slider__more-btn">ПОДРОБНЕЕ</a>
            </div>
          </div>
          <div class="slider__slide">
            <img src="assets/images/vcr_frame.png">
            <div class="slider__slide-info">
              <span class="slider__game-title">TYLER</span>
              <span class="slider__game-price">$100.00</span>
              <a href="index.html" class="slider__more-btn">ПОДРОБНЕЕ</a>
            </div>
          </div>
        </div>
      </div>
      <div class="slider__controls">
        <label for="slide1">*</label>
        <label for="slide2">*</label>
        <label for="slide3">*</label>
      </div>
    </div>
  </main>
  <footer>
    <div class="footer__info">
      <span class="footer__info-chapter">Клиентам</span>
      <span class="footer__info-chapter">Партнерам</span>
      <span class="footer__info-chapter">О нас</span>
      <span class="footer__info-chapter">Контакты</span>
    </div>
    <div class="footer__contacts">
      <span class="footer__contact">Телефон (8-800-999-55-99)</span>
      <span class="footer__contact">e-mail: best@games.ru</span>
    </div>
    <nav class="main-nav">
      <div class="main-nav__pages">
        <a href="index.html" class="main-nav__page-link main-nav__page-link--current">Главная</a>
        <a href="catalog.html" class="main-nav__page-link">Каталог</a>
        <a href="index.html" class="main-nav__search-link"><input class="main-nav__search" placeholder="Поиск"></a>
      </div>
      <div class="main-nav__auth">
        <a href="login.html" class="main-nav__page-link">Вход</a>
        <span>|</span>
        <a href="register.html" class="main-nav__page-link">Регистрация</a>
      </div>
    </nav>
  </footer>
</body>
</html>
